services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-security.debian.org}
    container_name: scann-native-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCANN_NATIVE_DATASET_ROOT: /data/dataset
      SCANN_NATIVE_DB_PATH: /data/dataset/scann_native.db
      SCANN_NATIVE_TASK_LOCK_TIMEOUT_SECONDS: ${SCANN_NATIVE_TASK_LOCK_TIMEOUT_SECONDS:-1200}
      SCANN_NATIVE_JWT_SECRET: ${SCANN_NATIVE_JWT_SECRET}
      SCANN_NATIVE_JWT_EXPIRE_MINUTES: ${SCANN_NATIVE_JWT_EXPIRE_MINUTES:-120}
      SCANN_ANNOTATION_SYNC_ENABLED: "false"
      SCANN_ANNOTATION_SYNC_DATABASE_URL: ""
      SCANN_ANNOTATION_SYNC_PG_DSN: ""
      SCANN_ANNOTATION_SYNC_INTERVAL_SECONDS: "0"
    volumes:
      - ${SCANN_DATASET_DIR:-./runtime/dataset}:/data/dataset
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - scann_net

  sync-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-security.debian.org}
    container_name: scann-native-sync-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCANN_NATIVE_DATASET_ROOT: /data/dataset
      SCANN_NATIVE_DB_PATH: /data/dataset/scann_native.db
      SCANN_NATIVE_TASK_LOCK_TIMEOUT_SECONDS: ${SCANN_NATIVE_TASK_LOCK_TIMEOUT_SECONDS:-1200}
      SCANN_NATIVE_JWT_SECRET: ${SCANN_NATIVE_JWT_SECRET}
      SCANN_NATIVE_JWT_EXPIRE_MINUTES: ${SCANN_NATIVE_JWT_EXPIRE_MINUTES:-120}
    volumes:
      - ${SCANN_DATASET_DIR:-./runtime/dataset}:/data/dataset
      - sync_socket:/sync
    command:
      - sh
      - -c
      - rm -f /sync/scann-sync.sock && uvicorn scann.native_annotation.app:app --uds /sync/scann-sync.sock
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "test -S /sync/scann-sync.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    container_name: scann-native-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      sync-backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - sync_socket:/var/run/scann-sync
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - scann_net

networks:
  scann_net:
    name: scann-native-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-scann

volumes:
  sync_socket:
