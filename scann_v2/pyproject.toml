[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scann"
version = "2.0.0"
description = "Star/Source Classification and Analysis Neural Network"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "PyJWT>=2.8",
    "passlib>=1.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24,<2",
    "opencv-python>=4.8,<4.12",
    "PyQt5>=5.15",
    "astropy>=5.3",
    "astroquery>=0.4.7",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "pytest-mock>=3.11",
]

[project.scripts]
scann = "scann.app:main"
scann-dataset-audit = "scann.core.dataset_audit:main"
scann-dataset-migrate = "scann.core.dataset_migrate:main"
scann-dataset-partition = "scann.ai.dataset_partition:main"
scann-candidate-evaluate = "scann.ai.candidate_evaluation:main"
scann-prelabel-worker = "scann.native_annotation.prelabel_worker:main"
scann-training-worker = "scann.native_annotation.training_job_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]

[tool.setuptools.packages.find]
where = ["src"]
